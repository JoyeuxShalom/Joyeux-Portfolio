# Netlify detects Next.js and applies its Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Pinned explicitly so the Next.js adapter always runs on the build output.
[[plugins]]
  package = "@netlify/plugin-nextjs"
